<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Divyanshu Dwivedi — Machine Learning, Artificial Intelligence, Research</title>
  <desc id="d">Dark banner with the name Divyanshu Dwivedi and a small abstract neural network diagram.</desc>
  <defs>
    <clipPath id="card">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6EDF3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="320" fill="#0B1020"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="660" y="0" width="540" height="320" fill="url(#glow)"/>

    <!-- text -->
    <text x="60" y="135" font-size="52" font-weight="700" fill="#E6EDF3">Divyanshu Dwivedi</text>
    <rect x="60" y="156" width="56" height="4" rx="2" fill="#4FD1C5"/>
    <text x="60" y="197" font-size="20" letter-spacing="0.5" fill="#4FD1C5">Machine Learning • Artificial Intelligence • Research</text>
    <text x="60" y="232" font-size="16" fill="#8B949E">College student · learning, building, experimenting</text>

    <!-- network: all connections -->
    <path fill="none" stroke="#4FD1C5" stroke-opacity="0.18" stroke-width="1.2" d="
      M760 90 L900 55 M760 90 L900 125 M760 90 L900 195 M760 90 L900 265
      M760 160 L900 55 M760 160 L900 125 M760 160 L900 195 M760 160 L900 265
      M760 230 L900 55 M760 230 L900 125 M760 230 L900 195 M760 230 L900 265
      M900 55 L1040 90 M900 55 L1040 160 M900 55 L1040 230
      M900 125 L1040 90 M900 125 L1040 160 M900 125 L1040 230
      M900 195 L1040 90 M900 195 L1040 160 M900 195 L1040 230
      M900 265 L1040 90 M900 265 L1040 160 M900 265 L1040 230"/>

    <!-- network: two highlighted paths -->
    <path fill="none" stroke="#4FD1C5" stroke-opacity="0.9" stroke-width="2.2" d="M760 160 L900 125 L1040 160"/>
    <path fill="none" stroke="#818CF8" stroke-opacity="0.9" stroke-width="2.2" d="M760 230 L900 195 L1040 230"/>

    <!-- network: plain nodes -->
    <g fill="#0B1020" stroke="#4FD1C5" stroke-opacity="0.7" stroke-width="2">
      <circle cx="760" cy="90" r="7"/>
      <circle cx="900" cy="55" r="7"/>
      <circle cx="900" cy="265" r="7"/>
      <circle cx="1040" cy="90" r="7"/>
    </g>

    <!-- network: highlighted nodes -->
    <g fill="#4FD1C5">
      <circle cx="760" cy="160" r="8"/>
      <circle cx="900" cy="125" r="8"/>
      <circle cx="1040" cy="160" r="8"/>
    </g>
    <g fill="#818CF8">
      <circle cx="760" cy="230" r="8"/>
      <circle cx="900" cy="195" r="8"/>
      <circle cx="1040" cy="230" r="8"/>
    </g>
  </g>
</svg>
